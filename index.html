<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#0e1b24;color:#eaf2f5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 12px;background:#2c7a7b;color:#fff;font-size:14px;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
button:disabled{background:#33444d;color:#78909c;cursor:not-allowed}
#wrap{max-width:1100px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
header h1{font-size:20px}

header .btns button{background:#37474f;font-size:12px;padding:6px 10px}
#scene{height:150px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:30px;padding-bottom:6px;margin-bottom:8px;transition:background .8s}
#scene canvas{position:absolute;inset:0;width:100%;height:100%}
#sc-art{position:relative;z-index:1;white-space:nowrap;transition:filter .5s}
.w-clear{background:linear-gradient(#4fc3f7,#b3e5fc 60%,#f6d99c 61%)}
.w-cloudy{background:linear-gradient(#90a4ae,#cfd8dc 60%,#e0c58f 61%)}
.w-rain{background:linear-gradient(#546e7a,#78909c 60%,#b9a173 61%)}
.w-storm{background:linear-gradient(#263238,#455a64 60%,#8d7b58 61%)}
.w-heat{background:linear-gradient(#ff8a65,#ffcc80 60%,#f4c06a 61%)}
#scene .badge,#scene .badge2{position:absolute;top:8px;z-index:2;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:20px;font-size:13px}
#scene .badge{left:10px;font-size:14px}#scene .badge2{right:10px}
#hint{background:#2b3a1f;border:1px solid #689f38;border-radius:10px;padding:7px 12px;font-size:13px;margin-bottom:8px;color:#dcedc8}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stat{background:#17303c;border-radius:10px;padding:8px}

.bar i{display:block;height:100%;transition:width .3s}

#areas button.on{background:#f9a825;color:#222;font-weight:bold}
.adesc{font-size:12px;color:#b0bec5;margin-bottom:8px;line-height:1.5}
.act{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:6px;background:#26424f}
.act small{color:#b0e0e6;display:block;font-size:11px;font-weight:normal}
.act .c{white-space:nowrap;font-size:12px;color:#ffd54f}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;background:#26424f;padding:7px 4px;font-size:13px}
.tabs button.on{background:#f9a825;color:#222;font-weight:bold}
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.it{background:#0f222b;border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:4px}
.it.zero{opacity:.35}
.it small{color:#90a4ae;font-size:10px}
.it button{padding:3px 8px;font-size:11px;background:#2e7d32}
.status{font-size:12px;color:#b0bec5;margin-top:8px;line-height:1.7}
.rc{background:#0f222b;border-radius:8px;padding:8px;margin-bottom:6px}
.rc .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
.rc .d{font-size:11px;color:#b0bec5;margin:3px 0}

#log{margin-top:8px;max-height:170px;overflow:auto;font-size:13px;line-height:1.6}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}

#md{background:#17303c;border:2px solid #f9a825;border-radius:14px;padding:18px;max-width:470px;width:100%;max-height:92vh;overflow:auto}

#md h2{margin-bottom:10px;font-size:18px}
#mb{font-size:14px;line-height:1.7;margin-bottom:14px}
#mbtn{display:flex;flex-direction:column;gap:8px}
#mbtn.row{flex-direction:row;flex-wrap:wrap}#mbtn.row button{flex:1}
#mbtn button{padding:10px}
.tb{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 10px}
.tb th{background:#0f222b;color:#80deea;padding:5px;text-align:left}
.tb td{border-bottom:1px solid #22414f;padding:5px;vertical-align:top}
.tl{padding-left:18px;font-size:13px;margin:6px 0}.tl li{margin-bottom:4px}
.dopt{background:#0f222b;border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px}
.dopt small{color:#b0bec5}
.dopt label{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px}
.dopt input{flex:1}
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,40,50,.96);border:1px solid #f9a825;padding:8px 14px;border-radius:20px;font-size:13px;animation:tin .3s,tout .5s 2.4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
@media(max-width:760px){#main{grid-template-columns:1fr}#stats{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div id="wrap">
  <header>
    <h1>🏝️ 무인도 30일 생존기</h1>
    <div class="btns">
      <button onclick="tutorial(0,null,'닫기')">❓ 도움말</button>
      <button id="b-sfx" onclick="togSfx()"></button>

    <div class="stat"><div class="lb"><span>🍖 포만감</span><span id="v-food"></span></div><div class="bar"><i id="b-food" style="background:#ffa726"></i></div></div>
    <div class="stat"><div class="lb"><span>💧 수분</span><span id="v-water"></span></div><div class="bar"><i id="b-water" style="background:#29b6f6"></i></div></div>
    <div class="stat"><div class="lb"><span>⏱ 남은 시간</span><span id="v-time"></span></div><div class="bar"><i id="b-time" style="background:#ab47bc"></i></div></div>

<script>
/* ================= 기본 유틸 ================= */
const KEY='island30_save_v2',MKEY='island30_meta_v2';
let S=null;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= 메타 (도감·기록·설정) ================= */
let META={tutorial:0,items:{},events:{},recipes:{},areas:{camp:1},endings:{},ach:{},best:{score:0,day:0},plays:0,wins:0,fails:0,sfx:1,bgm:1};
function loadMeta(){try{const d=JSON.parse(localStorage.getItem(MKEY));if(d)META=Object.assign(META,d)}catch(e){}}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(META))}catch(e){}}

/* ================= 사운드 (WebAudio 합성) ================= */
const SND={ctx:null,rain:null};
function AC(){
  if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C()}
  if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;
}
function tone(f,d,type,v,delay,slide){
  const c=SND.ctx;if(!c)return;const t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noiseBurst(d,v,freq){
  const c=SND.ctx;if(!c)return;const len=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
const SFX={
  click:()=>tone(660,.05,'square',.025),
  get:()=>{tone(523,.08,'triangle',.07);tone(784,.1,'triangle',.07,.07)},
  hurt:()=>tone(220,.25,'sawtooth',.07,0,.5),
  eat:()=>{tone(300,.06,'square',.05);tone(380,.06,'square',.05,.09)},
  drink:()=>tone(500,.18,'sine',.07,0,1.7),
  craft:()=>{tone(392,.1,'square',.05);tone(523,.1,'square',.05,.1);tone(659,.2,'square',.05,.2)},
  night:()=>[392,330,262].forEach((f,i)=>tone(f,.45,'sine',.07,i*.25)),
  morning:()=>[262,330,392,523].forEach((f,i)=>tone(f,.3,'triangle',.07,i*.15)),
  event:()=>{tone(440,.12,'triangle',.07);tone(554,.12,'triangle',.07,.12)},
  level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.08,i*.1)),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.09,i*.18)),
  lose:()=>[330,262,208,165].forEach((f,i)=>tone(f,.45,'sawtooth',.06,i*.3)),
  thunder:()=>noiseBurst(1.6,.3,260)
};
function sfx(n){if(!META.sfx||!SND.ctx)return;try{SFX[n]&&SFX[n]()}catch(e){}}
function ambient(){
  const c=SND.ctx;if(!c)return;
  if(!SND.rain){
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.4;
    const g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(c.destination);src.start();SND.rain=g;
  }
  const w=S?S.weather:'clear';
  const v=(!META.bgm||(S&&S.over))?0:(w==='rain'?.06:w==='storm'?.12:0);
  SND.rain.gain.setTargetAtTime(v,c.currentTime,.4);
}
function bgmStep(){
  if(!SND.ctx||!META.bgm||!S||S.over)return;
  const w=S.weather,night=S.time<=3,bad=(w==='storm'||w==='rain');
  const sc=bad?[0,3,5,7,10]:[0,2,4,7,9],base=night?196:(w==='storm'?174:220);
  const n=1+(Math.random()<.4?1:0);
  for(let i=0;i<n;i++){const st=pick(sc)+(Math.random()<.4?12:0);tone(base*Math.pow(2,st/12),2.4,'sine',.035,i*.6)}
  if(Math.random()<.25)tone(base/2,3,'triangle',.03);
}
setInterval(bgmStep,2400);
document.addEventListener('click',e=>{AC();ambient();if(e.target.closest&&e.target.closest('button:not(:disabled)'))sfx('click')},true);
function togSfx(){META.sfx=META.sfx?0:1;saveMeta();render()}
function togBgm(){META.bgm=META.bgm?0:1;saveMeta();ambient();render()}

/* ================= 토스트 ================= */
function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML=m;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3000)}

/* ================= 데이터 ================= */
const WEATHER={

  rain:{n:'비',i:'🌧️',d:'빗물 마시기 가능, 낚시 유리(성공률 +10%, 생선 +1). 집이 없으면 밤에 체력 -6. 빗물통은 물 +3, 어망·텃밭 수확 +1.'},
  storm:{n:'폭풍',i:'⛈️',d:'야외 행동 +1시간, 40% 확률로 체력 -6. 밤에 체력 -15 (움막 -8, 통나무집 -3, 석조집 0). 빗물통 물 +5. 뗏목 성공률 -40%.'},
  heat:{n:'폭염',i:'🥵',d:'수분 소모 시간당 3 (평소 2), 밤 수분 -14 (평소 -8). 뗏목 보정 없음.'}
};

  hide:{n:'가죽',i:'🦌'},pearl:{n:'진주',i:'🦪'},
  berry:{n:'열매',i:'🍓',use:{food:8},spoil:1},
  shellfish:{n:'조개',i:'🐚',use:{food:10},spoil:1},
  egg:{n:'새알',i:'🥚',use:{food:16,hp:2},spoil:1},
  fish:{n:'생선(날것)',i:'🐟',use:{food:14},risk:.2,spoil:1},
  meat:{n:'고기(날것)',i:'🥩',use:{food:18},risk:.25,spoil:1},
  cfish:{n:'구운 생선',i:'🍢',use:{food:32},spoil:1},
  cmeat:{n:'구운 고기',i:'🍖',use:{food:42,hp:3},spoil:1},
  stew:{n:'생존 스튜',i:'🍲',use:{food:45,water:12,hp:6},spoil:1},
  jerky:{n:'육포',i:'🥓',use:{food:26}},
  canned:{n:'통조림',i:'🥫',use:{food:35,water:5}},
  honey:{n:'야생 꿀',i:'🍯',use:{food:12,hp:10}},
  coconut:{n:'코코넛',i:'🥥',use:{food:5,water:18}},
  water:{n:'깨끗한 물',i:'💧',use:{water:30}},
  herb:{n:'약초',i:'🌿',use:{hp:20}},
  salve:{n:'약초 연고',i:'🧴',use:{hp:45}}

const AREAS={
  camp:{n:'캠프',i:'🏕️',d:'휴식, 요리, 가공, 하루를 마무리하는 곳입니다.'},
  beach:{n:'해변',i:'🏖️',d:'조개와 유목, 물고기가 있습니다. 비교적 안전합니다.'},
  forest:{n:'정글',i:'🌴',d:'나무, 열매, 약초, 사냥감이 있지만 위험도 있습니다.'},
  rocks:{n:'바위언덕',i:'⛰️',d:'돌의 주요 산지입니다. 깊이 탐험하면 무언가 발견할지도...'},
  cave:{n:'동굴',i:'🕳️',d:'어둡고 위험하지만 귀한 금속이 잠들어 있습니다.',lock:()=>!S.unlocked.cave,lt:'바위언덕을 3번 탐험'},
  falls:{n:'폭포',i:'💦',d:'맑은 물이 끝없이 흐르는 안전한 수원지입니다.',lock:()=>!S.unlocked.falls,lt:'정글을 3번 탐험'},
  reef:{n:'산호초',i:'🪸',d:'조개·물고기·진주가 풍부한 얕은 바다. 해파리를 조심하세요.',lock:()=>!S.unlocked.reef,lt:'해변을 3번 탐험'},
  wreck:{n:'난파선',i:'⚓',d:'좌초된 큰 배의 잔해. 금속과 통조림이 남아 있지만 선체가 불안정합니다.',lock:()=>!S.unlocked.wreck,lt:'산호초를 3번 탐험'},
  peak:{n:'산 정상',i:'🏔️',d:'섬 전체가 내려다보이는 곳. 날씨를 정확히 읽고 배를 찾을 수 있습니다.',lock:()=>!S.unlocked.peak,lt:'동굴을 3번 탐험'}
};
const DIFFS={
  easy:{n:'🌴 쉬움',d:'여유로운 휴양 모드. 시작 보급품(나무4·섬유3·열매3·물3)을 받습니다.',drain:.75,dmg:.7,spoil:.6,start:{wood:4,fiber:3,berry:3,water:3}},
  normal:{n:'🏝️ 보통',d:'기본 밸런스. 처음 하신다면 이 난이도를 권장합니다.',drain:1,dmg:1,spoil:1,start:{}},
  hard:{n:'💀 어려움',d:'혹독한 생존. 소모·피해·부패가 크게 늘어납니다.',drain:1.3,dmg:1.5,spoil:1.4,start:{}}
};
const SKILLS={
  gather:{i:'🌿',n:'채집가',d:'채집 시 추가 획득 확률 +10%/Lv',g:'줍기·베기·캐기·따기 등 채집 행동'},
  hunt:{i:'🎣',n:'사냥꾼·어부',d:'낚시·사냥 성공률 +4%/Lv, 수확 추가 확률 +10%/Lv',g:'낚시·사냥·작살·둥지 털기'},
  explore:{i:'🧭',n:'탐험가',d:'야외 부상 피해 -1/Lv, 탐험 성공률 +4%/Lv',g:'깊이 탐험·진주 찾기'},
  craft:{i:'⚒️',n:'장인',d:'제작 재료 -8%/Lv, Lv4부터 2시간 이상 제작은 -1시간',g:'제작'},
  survive:{i:'💪',n:'생존가',d:'포만감·수분 소모 -4%/Lv, 밤 회복 +1/Lv',g:'하루를 버티기 (밤마다 +3)'}

/* ================= 로그 / 스탯 헬퍼 ================= */
function log(m,t){
  if(!t){t=/체력 -|실패|다쳤|잃었|쓰러|굶주|탈수/.test(m)?'bad':/획득|얻었|발견|\+/.test(m)?'good':''}
  S.log.unshift({m,t});if(S.log.length>40)S.log.pop();
}
// 피해 적용 후 실제 피해량 반환 (난이도·탐험가 스킬 반영)
function H(n,cause,out){
  let d=n*D().dmg;if(out)d-=skLv('explore');d=Math.max(1,Math.round(d));
  S.hp=Math.max(0,S.hp-d);if(cause)S.cause=cause;sfx('hurt');return d;
}
function heal(n){S.hp=clamp(S.hp+n)}
function gain(k,n){if(n<=0)return'';S.inv[k]=(S.inv[k]||0)+n;META.items[k]=1;return ITEMS[k].i+ITEMS[k].n+' +'+n}
function gainG(k,n){return gain(k,n+(Math.random()<skLv('gather')*.1?1:0))}
function has(k,n){return(S.inv[k]||0)>=n}
function spend(c){
  S.time-=c;const dr=drainMul();
  S.food=clamp(S.food-1.5*c*dr);
  S.water=clamp(S.water-(S.weather==='heat'?3:2)*c*dr);
  if(S.food<=0){const d=H(4,'굶주림');log('🍽️ 굶주려서 힘이 빠진다! 체력 -'+d)}
  if(S.water<=0){const d=H(5,'탈수');log('🏜️ 목이 말라 쓰러질 것 같다! 체력 -'+d)}
}
function checkDeath(){
  if(S.hp<=0&&!S.over){
    S.over=true;localStorage.removeItem(KEY);META.fails++;META.best.day=Math.max(META.best.day,S.day);saveMeta();sfx('lose');render();
    modal('💀 생존 실패',`<b>${S.day}일차</b>에 <b>${S.cause||'알 수 없는 이유'}</b>(으)로 쓰러졌다...<br><br>다음엔 더 잘 준비해 보자.<br><small>최고 기록: ${META.best.day}일 / 최고 점수 ${META.best.score}</small>`,[{t:'다시 도전',fn:()=>showStartMenu(false)}]);
    return true;
  }
  return S.over;
}

function explore(area,loot,badTxt,badDmg,cause,key,msg){
  S.explore[area]++;let m;const r=Math.random()-skLv('explore')*.04;
  if(r<.5)m='탐험 중 '+loot()+' 발견!';
  else if(r<.7)m=badTxt+' 체력 -'+H(badDmg,cause,1);
  else m='특별한 것은 발견하지 못했다.';
  if(S.explore[area]>=3&&!S.unlocked[key]){S.unlocked[key]=true;m+='\n'+msg;toast('🧭 새로운 장소 발견!')}
  return m;
}

function perform(id){
  if(S.over)return;const a=ACTIONS.find(x=>x.id===id);
  if(a.special){sleep();return}
  const cost=a.cost+((S.weather==='storm'&&a.out)?1:0);
  if(S.time<cost){log('⏱ 시간이 부족하다. 잠을 자자.','sys');render();return}
  const m=a.run();
  if(S.over)return;
  log(m);spend(cost);
  if(a.sk)addXp(a.sk,Math.max(1,a.cost));
  if(S.weather==='storm'&&a.out&&Math.random()<(S.built.clothes?.2:.4)){const d=H(6,'폭풍',1);log('⛈️ 폭풍에 휘말려 다쳤다! 체력 -'+d)}
  if(!/체력 -/.test(m))sfx('get');

}
function afterAction(){
  if(checkDeath())return;
  if(S.time<=0){log('🌙 해가 저물었다...','sys');endDay()}else{save();render()}
}
function sleep(){
  if(S.time>0){heal(S.time);log(`😴 일찍 잠들어 체력 +${S.time}`,'good')}
  S.time=0;endDay();
}
function useItem(k){
  if(!has(k,1)||S.over)return;const it=ITEMS[k];S.inv[k]--;const m=[];
  if(it.use.food){S.food=clamp(S.food+it.use.food);m.push('포만감 +'+it.use.food)}
  if(it.use.water){S.water=clamp(S.water+it.use.water);m.push('수분 +'+it.use.water)}
  if(it.use.hp){heal(it.use.hp);m.push('체력 +'+it.use.hp)}
  sfx(it.use.water&&!it.use.food?'drink':'eat');
  let t=`${it.i} ${it.n} 사용: ${m.join(', ')}`;
  if(it.risk&&Math.random()<it.risk)t+='\n으윽, 배탈이 났다! 체력 -'+H(8,'배탈');
  log(t);if(!checkDeath()){save();render()}
}

const effCost=r=>{const o={},l=skLv('craft');Object.entries(r.cost).forEach(([k,n])=>o[k]=Math.max(1,Math.round(n*(1-.08*l))));return o};
const effT=r=>Math.max(1,r.t-((skLv('craft')>=4&&r.t>=2)?1:0));
function canCraft(r){return Object.entries(effCost(r)).every(([k,n])=>has(k,n))&&S.time>=effT(r)}
function craft(id){
  if(S.over)return;const r=RECIPES.find(x=>x.id===id);if(!canCraft(r))return;
  const c=effCost(r),t=effT(r);
  Object.entries(c).forEach(([k,n])=>S.inv[k]-=n);
  r.apply();META.recipes[id]=1;
  log(`🔨 ${r.i} ${r.n} 제작 완료! 획득`,'good');toast(`🔨 ${r.i} ${r.n} 제작 완료!`);sfx('craft');
  addXp('craft',r.t*2);spend(t);afterAction();
}

function endDay(){
  const L=[],sh=S.built.shelter,dr=drainMul();sfx('night');
  S.food=clamp(S.food-8*dr);S.water=clamp(S.water-(8+(S.weather==='heat'?6:0))*dr);
  L.push('🌙 밤새 허기와 갈증이 찾아왔다.');
  let fireOn=false;
  if(S.built.fire){
    if(has('wood',1)){S.inv.wood--;fireOn=true;L.push('🔥 모닥불에 땔감 1개를 넣었다.')}
    else L.push('🥶 땔감이 없어 모닥불이 꺼졌다!');
  }
  // 날씨 피해
  let dmg=0,why='',txt='';
  if(S.weather==='storm'){dmg=[15,8,3,0][sh];why='폭풍';txt=dmg?'⛈️ 폭풍이 몰아쳤다!':'⛈️ 폭풍이 몰아쳤지만 튼튼한 집 덕에 무사했다.'}
  else if(S.weather==='rain'){if(sh===0){dmg=6;why='저체온증';txt='🌧️ 비를 맞으며 밤을 보냈다.'}}
  else if(!fireOn&&sh===0){dmg=3;why='추위';txt='🥶 차가운 밤바람에 몸이 떨렸다.'}
  const raw=dmg;
  if(S.built.clothes&&dmg>0)dmg=Math.max(0,dmg-3);
  if(fireOn&&dmg>0)dmg=Math.floor(dmg/2);
  if(dmg>0){const d=H(dmg,why);L.push(`${txt} 체력 -${d}`)}
  else if(raw>0)L.push(`${txt} 하지만 따뜻하게 버텨 피해는 없었다.`);
  else if(txt)L.push(txt);
  // 빗물통
  if(S.built.barrel&&(S.weather==='rain'||S.weather==='storm')){const n=S.weather==='storm'?5:3;S.inv.water=(S.inv.water||0)+n;META.items.water=1;L.push(`🪣 빗물통에 물이 찼다. 💧 +${n}`)}
  // 부패
  const rate=(S.built.rack?.08:.3)*D().spoil,sp=[];
  Object.keys(ITEMS).forEach(k=>{if(ITEMS[k].spoil&&S.inv[k]>0){const l=Math.min(S.inv[k],Math.floor(S.inv[k]*rate+Math.random()));if(l){S.inv[k]-=l;sp.push(ITEMS[k].i+'×'+l)}}});
  if(sp.length)L.push('🤢 상해서 버린 음식: '+sp.join(' '));
  // 자동 시설
  const rainy=S.weather==='rain'||S.weather==='storm';
  if(S.built.trap&&Math.random()<.45){L.push('🪤 덫에 사냥감이 걸렸다! '+gain('meat',1)+(Math.random()<.25?', '+gain('hide',1):''))}
  if(S.built.net){L.push('🕸️ 어망에 물고기가 걸렸다! '+gain('fish',rnd(1,2)+(rainy?1:0)))}
  if(S.built.garden){let t='🌱 텃밭에서 수확! '+gain('berry',rnd(2,3)+(rainy?1:0));if(Math.random()<.35)t+=', '+gain('herb',1);L.push(t)}
  // 회복 / 결핍
  if(S.food>30&&S.water>30){const h=6+sh*3+(fireOn?3:0)+(S.built.hammock?3:0)+skLv('survive');heal(h);L.push(`💤 푹 자서 체력 +${h}`)}
  if(S.food<=0){const d=H(10,'굶주림');L.push('🍽️ 굶주림으로 체력 -'+d)}
  if(S.water<=0){const d=H(12,'탈수');L.push('🏜️ 탈수로 체력 -'+d)}
  if(checkDeath())return;
  if(S.day>=30){ending('rescue');return}
  addXp('survive',3);
  S.day++;S.time=12;S.weather=S.nextWeather;S.nextWeather=pickWeather(S.day+1);setForecast();S.signalToday=false;
  L.push(`<br>🌅 <b>${S.day}일차</b> 아침 — 오늘 날씨: ${WEATHER[S.weather].i} ${WEATHER[S.weather].n}`);
  L.forEach(x=>log(x.replace(/<br>/g,''),'sys'));
  save();render();
  modal(`🌙 ${S.day-1}일차 밤이 지나갔다`,L.join('<br>'),[{t:'아침을 맞이한다',fn:()=>{sfx('morning');showEvent()}}]);
}

 {id:'crab',i:'🦀',t:'바위게 떼',d:'바위틈에 커다란 게들이 가득하다.',ch:[
  {t:'잡는다',run(){if(Math.random()<.5){return gain('shellfish',4)+' 획득! 하지만 집게에 물렸다. 체력 -'+H(4,'게 집게')}return gain('shellfish',4)+' 획득!'}}]},
 {id:'chest',i:'🧰',t:'낡은 보물 상자',d:'모래 속에서 녹슨 상자의 모서리가 드러났다.',ch:[

 {id:'ship',i:'🚢',t:'수평선 위의 배',d:'멀리 수평선에 배 한 척이 지나간다!',when:()=>S.built.signal,ch:[
  {t:'봉화를 피운다 (나무 2)',run(){if(has('wood',2)){S.inv.wood-=2;S.rescue+=2;return '봉화를 본 선원이 손을 흔들었다! 구조 신호 +2'}return '땔감이 부족하다... 배는 멀어졌다.'}}]},
 {id:'farship',i:'🚢',t:'멀리 지나가는 배',d:'수평선 너머로 배가 지나가지만 이쪽을 보지 못한다...',when:()=>!S.built.signal&&S.day>=4,ch:[
  {t:'소리쳐 부른다',run(){S.water=clamp(S.water-10);return '목이 쉬도록 외쳤지만 닿지 않았다. 수분 -10. "봉화가 있었다면..."'}},

  {t:'감상한다',run(){heal(8);return '희망이 샘솟는다! 체력 +8'}}]},
 // ---- 신규 사건 ----
 {id:'honey',i:'🍯',t:'벌집 발견',d:'나무 위에 커다란 벌집이 매달려 있다. 달콤한 향이 진동한다.',ch:[

  {t:'창으로 노린다',run(){if(S.tools.spear&&Math.random()<.55)return '대어를 잡았다! '+gain('meat',4)+', '+gain('hide',1)+' 획득';return '상어의 반격! 체력 -'+H(12,'상어')}},

 {id:'seagull',i:'🐦',t:'갈매기 떼',d:'갈매기들이 한 방향으로 몰려간다. 먹이터가 있는 걸까?',ch:[
  {t:'따라간다 (⏱1)',run(){spend(1);return '갈매기 둥지 근처에서 '+gain('egg',2)+', '+gain('shellfish',2)+' 획득!'}},

 {id:'thunder',i:'⚡',t:'벼락 맞은 나무',d:'지난밤 벼락에 쓰러진 거대한 나무가 길을 막고 있다.',ch:[
  {t:'장작으로 쓴다 (⏱2)',run(){spend(2);return '잘 마른 장작을 챙겼다. '+gain('wood',6)+' 획득'}},
  {t:'지나간다',run:()=>'나무를 돌아서 지나갔다.'}]},

  {t:'가까이 가본다',run(){if(Math.random()<.5)return '반짝이는 조개 속에서 '+gain('pearl',1)+'을 발견했다!';return '바위에 미끄러졌다! 체력 -'+H(5,'미끄러짐')}},

 {id:'mirror',i:'🪞',t:'반짝이는 유리 파편',d:'모래 속에서 커다란 거울 파편이 반짝이고 있다.',ch:[
  {t:'신호 거울로 쓴다',run(){if(S.built.signal){S.rescue++;return '봉화와 함께 거울로 빛 신호를 보냈다! 구조 신호 +1'}heal(3);return '거울에 비친 내 얼굴을 보니 정신이 번쩍 든다. 체력 +3 (봉화대가 있었다면 더 좋았을 텐데)'}}]},
 {id:'trader',i:'🛶',t:'떠돌이 카누',d:'작은 카누를 탄 상인이 해변에 닿았다. "먹을 걸 주면 쓸만한 걸 주지!"',when:()=>S.day>=6,ch:[
  {t:'구운 음식을 건넨다',run(){if(has('cfish',1)||
